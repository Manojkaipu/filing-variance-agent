[project]
name = "filing-variance-agent"
version = "0.2.0"
description = "SEC XBRL filings -> Spark medallion pipeline -> LLM variance commentary with deterministic verification and human review"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyspark>=3.5,<4.1",
    "pyyaml>=6.0",
    "requests>=2.31",
    "pandas>=2.0",          # Tableau CSV export
    "anthropic>=1.0",       # commentary drafter (not needed for --offline)
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# Delta Lake must match your Spark major version: delta-spark 3.x <-> Spark 3.5, 4.x <-> Spark 4.0.
delta = ["delta-spark>=3.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = ["e2e: runs the full pipeline on synthetic filings (needs Spark file writes)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731"]
