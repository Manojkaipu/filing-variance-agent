name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check src tests && ruff format --check src tests
      - name: Test (unit + end-to-end on synthetic filings)
        run: pytest -v
      - name: Demo
        run: python -m src.cli --db /tmp/queue.db demo && python -m src.cli --db /tmp/queue.db show 1
